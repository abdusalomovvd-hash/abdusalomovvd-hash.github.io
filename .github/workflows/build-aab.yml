name: Build Android App Bundle (.aab)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli@1.24.1

      - name: Decode signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "KEYSTORE_B64 secret is empty"; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"

      - name: Generate Android project
        working-directory: twa
        run: |
          unset ANDROID_SDK_ROOT
          yes | bubblewrap update --skipVersionUpgrade

      - name: Build signed .aab and .apk
        working-directory: twa
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          unset ANDROID_SDK_ROOT
          yes | bubblewrap build --skipPwaValidation \
            --signingKeyPath="$RUNNER_TEMP/upload.jks" \
            --signingKeyAlias="${{ secrets.KEY_ALIAS }}"
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: tejamkor-android
          path: |
            twa/app-release-bundle.aab
            twa/app-release-signed.apk
          retention-days: 30
